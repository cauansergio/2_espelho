<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Espelhos Angulares</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Remove scroll do body */
            position: fixed; /* Fixa na tela */
        }

        header {
            background-color: #2c3e50;
            color: white;
            width: 100%;
            padding: 12px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            flex-shrink: 0;
            height: 60px;
            box-sizing: border-box;
        }

        h1 { 
            margin: 0; 
            font-size: 1.5rem;
            line-height: 36px;
        }

        .developer-note {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            color: #ecf0f1;
            font-style: italic;
            line-height: normal;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            padding: 20px;
            width: 100vw;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        .canvas-container {
            flex: 2;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 280px;
            overflow-y: auto;
            max-height: 100%;
            min-height: 0;
        }

        .info-box {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .formula-display {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #333;
            white-space: pre-wrap;
            font-size: 0.85rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
        }

        label {
            font-weight: 600;
            color: #444;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            margin: 2px 0;
        }

        .exact-input-group {
            display: flex;
            gap: 8px;
            margin-top: 3px;
        }

        .exact-input-group input {
            flex: 1;
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
        }

        .exact-input-group button {
            padding: 6px 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 13px;
        }

        .exact-input-group button:hover {
            background-color: #43a047;
        }

        .buttons-row {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            flex-shrink: 0;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            flex: 1;
            font-size: 13px;
        }

        button.btn-bisector {
            background-color: #4caf50;
            color: white;
        }
        button.btn-bisector:hover { background-color: #43a047; }

        button.btn-reset {
            background-color: #9e9e9e;
            color: white;
        }
        button.btn-reset:hover { background-color: #757575; }

        .warning-box {
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #856404;
            display: none;
            margin-top: 8px;
        }

        .contact-warning {
            background-color: #f8d7da;
            border-left: 5px solid #dc3545;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #721c24;
            margin-top: 8px;
            display: none;
        }

        .angle-increase-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            width: 100%;
            font-size: 12px;
        }
        .angle-increase-btn:hover {
            background-color: #f57c00;
        }

        small {
            font-size: 0.75rem;
            color: #666;
        }

        @media (max-width: 800px) {
            .main-container { 
                flex-direction: column; 
                padding: 10px;
                gap: 10px;
            }
            .canvas-container { 
                flex: 1; 
                min-height: 0;
            }
            .developer-note {
                position: static;
                transform: none;
                text-align: center;
                margin-top: 2px;
                font-size: 0.8rem;
            }
            header {
                height: auto;
                min-height: 50px;
                padding: 8px 0;
            }
            h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Simulação de dois espelhos planos</h1>
    <div class="developer-note">Desenvolvido por Cauan Sergio</div>
</header>

<div class="main-container">
    <div class="canvas-container" id="canvasWrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="controls-panel">
        <div class="info-box">
            <div id="statsInfo"></div>
            <hr style="border: 0; border-top: 1px solid #bdc3c7; margin: 8px 0;">
            <div class="formula-display" id="formulaInfo"></div>
            <div class="warning-box" id="warningBox"></div>
            <div class="contact-warning" id="contactWarning"></div>
        </div>

        <div class="control-group">
            <label>
                Ângulo entre espelhos (&theta;)
                <span id="valTheta">60°</span>
            </label>
            <input type="range" id="sliderTheta" min="8" max="180" value="60" step="1">
            
            <div class="exact-input-group">
                <input type="number" id="exactTheta" min="8" max="180" step="1" placeholder="Ângulo exato (8-180)">
                <button id="btnExactTheta">Aplicar</button>
            </div>
        </div>

        <div class="control-group">
            <label>
                Ângulo do Objeto
                <span id="valObjAngle">30°</span>
            </label>
            <input type="range" id="sliderObjAngle" min="4" max="56" value="30" step="0.5">
            <small>Distância mínima dos espelhos: 4°</small>
        </div>

        <div class="control-group">
            <label>
                Distância (Raio)
                <span id="valRadius">3.0</span>
            </label>
            <input type="range" id="sliderRadius" min="0.5" max="4.5" value="3.0" step="0.1">
        </div>

        <div class="buttons-row">
            <button class="btn-bisector" id="btnBisector">Bissetriz</button>
            <button class="btn-reset" id="btnReset">Resetar</button>
        </div>
    </div>
</div>

<script>
    // --- Configuração e Estado ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasWrapper');

    // Elementos da UI
    const sliderTheta = document.getElementById('sliderTheta');
    const sliderObjAngle = document.getElementById('sliderObjAngle');
    const sliderRadius = document.getElementById('sliderRadius');
    const exactTheta = document.getElementById('exactTheta');
    const btnExactTheta = document.getElementById('btnExactTheta');
    const valTheta = document.getElementById('valTheta');
    const valObjAngle = document.getElementById('valObjAngle');
    const valRadius = document.getElementById('valRadius');
    const statsInfo = document.getElementById('statsInfo');
    const formulaInfo = document.getElementById('formulaInfo');
    const warningBox = document.getElementById('warningBox');
    const contactWarning = document.getElementById('contactWarning');
    const btnBisector = document.getElementById('btnBisector');
    const btnReset = document.getElementById('btnReset');

    // Constantes
    const OBJECT_RADIUS_PX = 10; // raio do objeto em pixels
    const IMAGE_RADIUS_PX = 8;   // raio das imagens em pixels
    const MIN_ANGLE_DISTANCE = 4; // Distância angular mínima do objeto aos espelhos (graus)

    // Estado da simulação
    let state = {
        thetaDeg: 60,
        objAngleDeg: 30,
        radius: 3.0,
        scale: 40, // Pixels por unidade
        width: 0,
        height: 0
    };

    // --- Funções Matemáticas Auxiliares ---

    function toRadians(deg) { return deg * Math.PI / 180; }
    function toDegrees(rad) { return rad * 180 / Math.PI; }

    function isOnBisector(objAngle, theta) {
        const bisector = theta / 2.0;
        // Tolerância de 0.5 graus
        return Math.abs(objAngle - bisector) < 0.5;
    }

    // Função melhorada que considera o tamanho do objeto
    function checkObjectContact() {
        // Converte o raio do objeto de pixels para unidades do mundo
        const objectRadiusUnits = OBJECT_RADIUS_PX / state.scale;
        
        // Posição do objeto
        const objRad = toRadians(state.objAngleDeg);
        const objX = state.radius * Math.cos(objRad);
        const objY = state.radius * Math.sin(objRad);
        
        // Distância ao espelho 1 (no eixo X) - é simplesmente a coordenada Y
        const distToMirror1 = Math.abs(objY);
        
        // Distância ao espelho 2
        const thetaRad = toRadians(state.thetaDeg);
        
        // Vetor direção do espelho 2
        const mirror2DirX = Math.cos(thetaRad);
        const mirror2DirY = Math.sin(thetaRad);
        
        // Distância perpendicular do objeto ao espelho 2
        // Fórmula: |(P × dir)| onde × é o produto vetorial em 2D
        const crossProduct = Math.abs(objX * mirror2DirY - objY * mirror2DirX);
        const distToMirror2 = crossProduct; // |dir| = 1, então é só o produto vetorial
        
        // Verifica se o objeto toca nos espelhos (distância < raio do objeto)
        const touchesMirror1 = distToMirror1 < objectRadiusUnits;
        const touchesMirror2 = distToMirror2 < objectRadiusUnits;
        
        // Ângulos mínimos necessários para evitar contato (considerando o tamanho)
        const minAngle1Rad = Math.asin(objectRadiusUnits / state.radius);
        const minAngle1Deg = toDegrees(minAngle1Rad);
        
        const minAngle2Rad = Math.asin(objectRadiusUnits / state.radius);
        const minAngle2Deg = toDegrees(minAngle2Rad);
        
        return {
            touchesMirror1,
            touchesMirror2,
            distToMirror1,
            distToMirror2,
            objectRadiusUnits,
            anyTouch: touchesMirror1 || touchesMirror2,
            minAngle1Deg,
            minAngle2Deg,
            objX,
            objY
        };
    }

    // Lógica principal de contagem de imagens CORRIGIDA
    function calculateNumberOfImages(thetaDeg, objOnBisector) {
        // Caso especial: θ = 0° (espelhos paralelos) → infinitas imagens
        if (thetaDeg === 0) {
            return { 
                N: Infinity, 
                formula: "θ = 0°\nEspelhos paralelos\nN = ∞ (infinitas imagens)",
                isExactDivisor: false,
                infiniteImages: true,
                parity: "N/A"
            };
        }
        
        const ratio = 360.0 / thetaDeg;
        const N_int = Math.floor(ratio); // Parte inteira de 360/θ
        
        // Determinar paridade baseado na parte inteira
        const isIntPartOdd = (N_int % 2 === 1);
        const parity = isIntPartOdd ? "ímpar" : "par";
        
        // Verifica se é divisor exato (360/θ é inteiro)
        const isExactDivisor = Math.abs(ratio - N_int) < 1e-10;
        
        let N, formula;

        if (isExactDivisor) {
            // Caso 1: 360/θ é inteiro
            // Determinar paridade baseado no valor inteiro
            if (N_int % 2 === 0) {
                // N é PAR: N = (360/θ) - 1
                N = N_int - 1;
                formula = `360°/${thetaDeg}° = ${N_int} (inteiro par)\nN = ${N_int} - 1 = ${N}`;
            } else {
                // N é ÍMPAR
                if (objOnBisector) {
                    // Na bissetriz: N = (360/θ) - 1
                    N = N_int - 1;
                    formula = `360°/${thetaDeg}° = ${N_int} (inteiro ímpar)\nObjeto NA bissetriz\nN = ${N_int} - 1 = ${N}`;
                } else {
                    // Fora da bissetriz: N = 360/θ
                    N = N_int;
                    formula = `360°/${thetaDeg}° = ${N_int} (inteiro ímpar)\nObjeto FORA da bissetriz\nN = ${N_int}`;
                }
            }
        } else {
            // Caso 2: 360/θ NÃO é inteiro
            // Usar paridade baseada na parte inteira
            if (isIntPartOdd) {
                // Parte inteira é ÍMPAR
                if (objOnBisector) {
                    // Na bissetriz: N = floor(360/θ) - 1
                    N = N_int - 1;
                    formula = `360°/${thetaDeg}° ≈ ${ratio.toFixed(2)}\nParte inteira = ${N_int} (ímpar)\nObjeto NA bissetriz\nN = ${N_int} - 1 = ${N}`;
                } else {
                    // Fora da bissetriz: N = floor(360/θ)
                    N = N_int;
                    formula = `360°/${thetaDeg}° ≈ ${ratio.toFixed(2)}\nParte inteira = ${N_int} (ímpar)\nObjeto FORA da bissetriz\nN = ${N_int}`;
                }
            } else {
                // Parte inteira é PAR: N = floor(360/θ) - 1
                N = N_int - 1;
                formula = `360°/${thetaDeg}° ≈ ${ratio.toFixed(2)}\nParte inteira = ${N_int} (par)\nN = ${N_int} - 1 = ${N}`;
            }
        }

        return { 
            N, 
            formula, 
            isExactDivisor, 
            infiniteImages: false,
            parity,
            ratio: ratio,
            intPart: N_int
        };
    }

    // --- Motor de Física (Reflexões) ---

    function calculateAllImages() {
        const thetaRad = toRadians(state.thetaDeg);
        const objRad = toRadians(state.objAngleDeg);
        
        // Posição do objeto original
        const objX = state.radius * Math.cos(objRad);
        const objY = state.radius * Math.sin(objRad);

        const onBisector = isOnBisector(state.objAngleDeg, state.thetaDeg);
        const { N: N_theory, formula, infiniteImages, parity, ratio, intPart } = calculateNumberOfImages(state.thetaDeg, onBisector);

        // Caso especial: θ = 0° (infinitas imagens)
        if (infiniteImages) {
            // Para demonstração, mostramos apenas algumas imagens
            const demoImages = [];
            const maxDemoImages = 12; // Número máximo de imagens para mostrar
            
            // Gera algumas imagens para demonstração
            for (let i = 1; i <= maxDemoImages; i++) {
                const angle = objRad + (i * Math.PI); // Reflexões alternadas
                const x = state.radius * Math.cos(angle);
                const y = state.radius * Math.sin(angle);
                demoImages.push({x, y, angle});
            }
            
            return { 
                images: demoImages, 
                N_theory: Infinity, 
                formula, 
                onBisector, 
                obj: {x: objX, y: objY},
                infiniteImages: true,
                parity: "N/A"
            };
        }

        if (N_theory <= 0) {
            return { 
                images: [], 
                N_theory, 
                formula, 
                onBisector, 
                obj: {x: objX, y: objY}, 
                infiniteImages: false,
                parity
            };
        }

        // BFS para encontrar imagens
        let images = [];
        let imageSet = new Set(); // Para evitar duplicatas baseada em string de coords arredondadas
        
        // Adiciona objeto ao set para não duplicar com ele mesmo
        const key = (x, y) => `${x.toFixed(4)},${y.toFixed(4)}`;
        imageSet.add(key(objX, objY));

        // Fila de processamento: [x, y, angulo_atual]
        // Angulo atual é o ângulo polar do ponto
        let toProcess = [{x: objX, y: objY, angle: objRad}];
        
        const mirror1Angle = 0;
        const mirror2Angle = thetaRad;

        let safetyCount = 0;
        
        // Loop até encontrar o número teórico ou esgotar reflexões possíveis
        while (images.length < N_theory && toProcess.length > 0 && safetyCount < 1000) {
            const current = toProcess.shift();
            safetyCount++;

            // Tenta refletir nos dois espelhos
            // Fórmulas de reflexão polar: novo_angulo = 2*angulo_espelho - angulo_atual
            
            const reflections = [
                { mAngle: mirror1Angle },
                { mAngle: mirror2Angle }
            ];

            reflections.forEach(ref => {
                const newAngle = 2 * ref.mAngle - current.angle;
                // Normaliza ângulo
                const xNew = state.radius * Math.cos(newAngle);
                const yNew = state.radius * Math.sin(newAngle);
                
                const k = key(xNew, yNew);
                
                if (!imageSet.has(k)) {
                    // Verifica se não é o objeto original (redundância por segurança float)
                    const distToObj = Math.hypot(xNew - objX, yNew - objY);
                    
                    if (distToObj > 1e-4) {
                        imageSet.add(k);
                        const newImg = {x: xNew, y: yNew, angle: newAngle};
                        images.push(newImg);
                        toProcess.push(newImg); // Adiciona na fila para gerar reflexões de ordem superior
                    }
                }
            });
        }

        // Limita ao número teórico (física real vs artefatos numéricos)
        if (images.length > N_theory) {
            images = images.slice(0, N_theory);
        }

        return { 
            images, 
            N_theory, 
            formula, 
            onBisector, 
            obj: {x: objX, y: objY}, 
            infiniteImages: false,
            parity,
            ratio,
            intPart
        };
    }

    // --- Renderização ---

    // Converte coordenadas do mundo (física) para coordenadas do canvas
    function worldToScreen(x, y) {
        const cx = state.width / 2;
        const cy = state.height / 2;
        return {
            x: cx + x * state.scale,
            y: cy - y * state.scale // Y invertido no canvas
        };
    }

    function drawGrid() {
        // Função vazia - grade removida
    }

    function drawMirrors() {
        const center = worldToScreen(0, 0);
        const length = 5; // Comprimento visual do espelho

        // Espelho 1 (Fixo no eixo X positivo)
        const m1End = worldToScreen(length, 0);
        ctx.strokeStyle = 'blue';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(center.x, center.y);
        ctx.lineTo(m1End.x, m1End.y);
        ctx.stroke();
        
        // Texto M1
        ctx.fillStyle = 'blue';
        ctx.font = 'bold 14px Arial';
        ctx.fillText("Espelho 1", m1End.x - 60, m1End.y + 20);

        // Espelho 2 (apenas se θ > 0)
        if (state.thetaDeg > 0) {
            const thetaRad = toRadians(state.thetaDeg);
            const m2x = length * Math.cos(thetaRad);
            const m2y = length * Math.sin(thetaRad);
            const m2End = worldToScreen(m2x, m2y);
            
            ctx.strokeStyle = 'red';
            ctx.beginPath();
            ctx.moveTo(center.x, center.y);
            ctx.lineTo(m2End.x, m2End.y);
            ctx.stroke();

            // Texto M2
            ctx.fillStyle = 'red';
            ctx.fillText("Espelho 2", m2End.x + 5, m2End.y);

            // Bissetriz prolongada em ambos os sentidos
            const bisAngle = thetaRad / 2;
            
            // Prolongamento da bissetriz no sentido positivo
            const bx1 = (length + 1.5) * Math.cos(bisAngle);
            const by1 = (length + 1.5) * Math.sin(bisAngle);
            const bEnd1 = worldToScreen(bx1, by1);
            
            // Prolongamento da bissetriz no sentido negativo (oposto)
            const bx2 = -2.5 * Math.cos(bisAngle);
            const by2 = -2.5 * Math.sin(bisAngle);
            const bEnd2 = worldToScreen(bx2, by2);

            ctx.strokeStyle = 'green';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(bEnd2.x, bEnd2.y);
            ctx.lineTo(bEnd1.x, bEnd1.y);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = 'green';
            ctx.font = '12px Arial';
            ctx.fillText("Bissetriz", bEnd1.x + 5, bEnd1.y);
        }
    }

    function drawScene() {
        // Limpar
        ctx.clearRect(0, 0, state.width, state.height);
        
        drawGrid();
        drawMirrors();

        // Verificar contato físico do objeto com os espelhos
        const contactInfo = checkObjectContact();
        
        // Calcular Física
        const data = calculateAllImages();
        
        // Desenhar Imagens como círculos amarelos
        data.images.forEach((img, index) => {
            const pos = worldToScreen(img.x, img.y);
            
            // Círculo amarelo para imagem
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, IMAGE_RADIUS_PX, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 235, 59, 0.8)'; // Amarelo
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ff9800'; // Laranja
            ctx.stroke();
            
            // Número dentro do círculo (apenas se não for infinitas imagens)
            if (!data.infiniteImages) {
                ctx.fillStyle = 'black';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index + 1, pos.x, pos.y);
            } else {
                // Para infinitas imagens, mostra reticências
                if (index === data.images.length - 1) {
                    ctx.fillStyle = 'red';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText("...", pos.x, pos.y);
                }
            }
        });

        // Desenhar Objeto Original (círculo vermelho)
        const objPos = worldToScreen(data.obj.x, data.obj.y);
        
        // Se houver contato, desenha um alerta visual
        if (contactInfo.anyTouch) {
            // Círculo vermelho pulsante (contorno mais grosso)
            ctx.beginPath();
            ctx.arc(objPos.x, objPos.y, OBJECT_RADIUS_PX + 4, 0, Math.PI * 2);
            ctx.strokeStyle = '#dc3545';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Linhas indicando qual espelho está tocando
            if (contactInfo.touchesMirror1) {
                const mirror1End = worldToScreen(5, 0);
                ctx.beginPath();
                ctx.moveTo(objPos.x, objPos.y);
                ctx.lineTo(mirror1End.x, mirror1End.y);
                ctx.strokeStyle = '#dc3545';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
            }
            
            if (contactInfo.touchesMirror2) {
                const thetaRad = toRadians(state.thetaDeg);
                const mirror2End = worldToScreen(5 * Math.cos(thetaRad), 5 * Math.sin(thetaRad));
                ctx.beginPath();
                ctx.moveTo(objPos.x, objPos.y);
                ctx.lineTo(mirror2End.x, mirror2End.y);
                ctx.strokeStyle = '#dc3545';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
            }
            
            ctx.setLineDash([]);
        }
        
        ctx.beginPath();
        ctx.arc(objPos.x, objPos.y, OBJECT_RADIUS_PX, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 67, 54, 0.9)'; // Vermelho
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'darkred';
        ctx.stroke();
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("O", objPos.x, objPos.y);

        // Atualizar UI de Texto
        updateInfoPanel(data, contactInfo);
    }

    function updateInfoPanel(data, contactInfo) {
        // Atualiza warning de contato físico
        if (contactInfo.anyTouch) {
            contactWarning.style.display = 'block';
            let touchMsg = "";
            if (contactInfo.touchesMirror1 && contactInfo.touchesMirror2) {
                touchMsg = "OBJETO TOCANDO AMBOS OS ESPELHOS!";
            } else if (contactInfo.touchesMirror1) {
                touchMsg = "OBJETO TOCANDO O ESPELHO 1!";
            } else if (contactInfo.touchesMirror2) {
                touchMsg = "OBJETO TOCANDO O ESPELHO 2!";
            }
            
            contactWarning.innerHTML = `
                <strong>⚠ ${touchMsg}</strong><br>
                <strong>Raio do objeto (r):</strong> ${contactInfo.objectRadiusUnits.toFixed(3)} u<br>
                <strong>Distância ao M1:</strong> ${contactInfo.distToMirror1.toFixed(3)} u<br>
                <strong>Distância ao M2:</strong> ${contactInfo.distToMirror2.toFixed(3)} u<br>
                <button class="angle-increase-btn" id="adjustRadiusBtn">Aumentar R</button>
            `;
            
            // Adiciona evento ao botão
            document.getElementById('adjustRadiusBtn').addEventListener('click', () => {
                sliderRadius.value = Math.min(4.5, state.radius + 0.5);
                updateParams();
            });
        } else {
            contactWarning.style.display = 'none';
        }

        if (state.thetaDeg === 0) {
            statsInfo.innerHTML = `
                <strong>Ângulo:</strong> 0°<br>
                <strong>Objeto:</strong> ${state.objAngleDeg.toFixed(1)}°<br>
                <strong>Imagens:</strong> ∞ (infinitas)
            `;
            
            warningBox.style.display = 'block';
            warningBox.innerHTML = `⚠ Espelhos paralelos - infinitas imagens`;
        } else {
            statsInfo.innerHTML = `
                <strong>θ:</strong> ${state.thetaDeg}°<br>
                <strong>360/θ:</strong> ${data.ratio.toFixed(2)}<br>
                <strong>N:</strong> ${data.N_theory}<br>
                <strong>Objeto:</strong> ${state.objAngleDeg.toFixed(1)}°<br>
                <strong>R:</strong> ${state.radius.toFixed(2)}
            `;
            
            warningBox.style.display = 'none';
        }
        
        formulaInfo.innerText = data.formula;
    }

    // --- Função para limitar o ângulo do objeto ---
    function updateObjectAngleLimit() {
        // O objeto deve estar a pelo menos 4° de cada espelho
        const minObjAngle = MIN_ANGLE_DISTANCE;
        const maxObjAngle = state.thetaDeg - MIN_ANGLE_DISTANCE;
        
        // Só atualiza se o intervalo for válido (theta ≥ 8°)
        if (maxObjAngle >= minObjAngle) {
            sliderObjAngle.min = minObjAngle;
            sliderObjAngle.max = maxObjAngle;
            
            // Ajusta o valor se estiver fora dos limites
            let currentObjAngle = parseFloat(sliderObjAngle.value);
            
            if (currentObjAngle < minObjAngle) {
                sliderObjAngle.value = minObjAngle;
            } else if (currentObjAngle > maxObjAngle) {
                sliderObjAngle.value = maxObjAngle;
            }
            
            // Atualiza o estado
            state.objAngleDeg = parseFloat(sliderObjAngle.value);
            valObjAngle.textContent = state.objAngleDeg.toFixed(1) + "°";
        }
    }

    // --- Função para aplicar ângulo exato ---
    function applyExactTheta() {
        const value = parseInt(exactTheta.value);
        
        if (value >= 8 && value <= 180) {
            // Atualiza o slider e o estado
            sliderTheta.value = value;
            state.thetaDeg = value;
            valTheta.textContent = value + "°";
            
            // Limpa o campo de entrada
            exactTheta.value = '';
            
            // Atualiza limite do ângulo do objeto
            updateObjectAngleLimit();
            
            // Redesenha a cena
            drawScene();
        } else {
            alert("Valor deve estar entre 8 e 180");
            exactTheta.focus();
        }
    }

    // --- Manipuladores de Eventos ---

    function resize() {
        // Ajusta tamanho do canvas ao container
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        state.width = rect.width;
        state.height = rect.height;
        
        // Ajusta escala baseada no menor lado
        state.scale = Math.min(state.width, state.height) / 11;
        
        drawScene();
    }

    function updateParams() {
        state.thetaDeg = parseInt(sliderTheta.value);
        
        // Atualiza limite do ângulo do objeto
        updateObjectAngleLimit();
        
        state.radius = parseFloat(sliderRadius.value);

        // Atualiza labels
        valTheta.textContent = state.thetaDeg + "°";
        valRadius.textContent = state.radius.toFixed(1);

        drawScene();
    }

    // Listeners Sliders
    sliderTheta.addEventListener('input', updateParams);
    sliderObjAngle.addEventListener('input', updateParams);
    sliderRadius.addEventListener('input', updateParams);

    // Listener para entrada exata
    btnExactTheta.addEventListener('click', applyExactTheta);
    
    // Permitir Enter na entrada exata
    exactTheta.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            applyExactTheta();
        }
    });

    // Listeners Botões
    btnBisector.addEventListener('click', () => {
        const newAngle = state.thetaDeg / 2.0;
        sliderObjAngle.value = newAngle;
        updateParams();
    });

    btnReset.addEventListener('click', () => {
        sliderTheta.value = 60;
        sliderObjAngle.value = 30;
        sliderRadius.value = 3.0;
        exactTheta.value = '';
        updateParams();
    });

    window.addEventListener('resize', resize);

    // Inicialização
    resize();
    updateParams();

</script>
